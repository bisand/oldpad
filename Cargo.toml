[package]
name = "oldpad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Give an old iPad a second life as a home dashboard"
repository = "https://github.com/bisand/oldpad"

# Dependency policy: std for everything we can write and review ourselves
# (HTTP, WebSocket, CBOR, base64, threads). Crates only for JSON and for
# cryptography, which is never hand-rolled. See docs/design.md.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
getrandom = "=0.3.4"
qrcodegen = "=1.8.0"

[dev-dependencies]
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std", "arithmetic"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
