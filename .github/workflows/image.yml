# Tests, then builds and pushes ghcr.io/bisand/oldpad on every push to main.
# Only one third-party action (checkout, pinned by commit); the rest is plain
# docker CLI, so there is little in the build that is not visible here.
name: image
on:
  push:
    branches: [main]
  pull_request:
# Tests and builds run project and dependency code, so they get no publishing rights.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test
        run: cargo test --locked
  # Each architecture builds natively: emulating arm64 would take far longer.
  build:
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build, check and push
        env:
          ARCH: ${{ matrix.arch }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          sha=${GITHUB_SHA::7}
          docker build \
            --label org.opencontainers.image.source="https://github.com/$REPOSITORY" \
            --label org.opencontainers.image.licenses=MIT \
            --build-arg OLDPAD_COMMIT="$sha" \
            -t "$image:sha-$sha-$ARCH" .
          # A binary that cannot start on this architecture must not be published.
          docker run -d --name smoke -p 127.0.0.1:18080:8080 --tmpfs /data:uid=65534,gid=65534 "$image:sha-$sha-$ARCH"
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/healthz
          docker rm -f smoke
          # Log in only after the build, so nothing in it can reach the credentials.
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$image:sha-$sha-$ARCH"
  # `main` moves only once every architecture has built and started.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish the multi-architecture image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          sha=${GITHUB_SHA::7}
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:sha-$sha" -t "$image:main" "$image:sha-$sha-amd64" "$image:sha-$sha-arm64"
          echo "$image@$(docker buildx imagetools inspect "$image:sha-$sha" --format '{{.Manifest.Digest}}')" >> "$GITHUB_STEP_SUMMARY"
