<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="oldpad">
<title>oldpad</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/tablet.css">
</head>
<body class="night">
<div id="pair" class="pair hidden">
  <h1 id="pair-title">Pair this screen</h1>
  <p id="pair-lead" class="lead">Scan the code with your phone and sign in with your passkey.</p>
  <div id="qr" class="qr"></div>
  <p><span id="pair-or">or open</span> <span id="pair-url" class="mono"></span></p>
  <p class="code"><span id="pair-code-label">Code</span> <span id="pair-code" class="mono"></span></p>
  <p class="code"><span id="pair-pin-label">Number</span> <span id="pair-pin" class="mono"></span></p>
  <p id="pair-status" class="muted"></p>
</div>
<div id="app" class="hidden">
  <div id="rail" class="rail"></div>
  <div id="page" class="page"></div>
</div>
<div id="link" class="link hidden" role="status"></div>
<div id="sleep" class="sleep hidden" data-act="wake"><span id="sleep-time"></span><span id="sleep-alert" class="hidden" role="alert"></span></div>
<div id="bell" class="bell hidden" data-act="bellclose" role="alert">
  <p id="bell-title"></p>
  <div class="bell-cam"><img id="bell-img" class="hidden" alt=""><span id="bell-t" class="cam-t hidden"></span></div>
  <p id="bell-hint" class="muted"></p>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/tablet.js"></script>
</body>
</html>
